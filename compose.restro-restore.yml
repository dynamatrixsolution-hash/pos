# Disposable recovery-rehearsal target. Distinct from compose.restro.yml (never shares its volume,
# port, database or credentials) and never combined with docker-compose.yml. Synthetic data only.
services:
  restro-restore-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: restro_restore
      POSTGRES_PASSWORD: ${RESTRO_RESTORE_DB_PASSWORD:?Run node scripts/restro-restore-env.mjs init first}
      POSTGRES_DB: restro_restore
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - restro_restore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restro_restore -d restro_restore"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  restro_restore_data:

