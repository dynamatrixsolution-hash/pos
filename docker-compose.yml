version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: dynaone-db
    restart: always
    environment:
      POSTGRES_USER: abhi
      POSTGRES_PASSWORD: a11221
      POSTGRES_DB: prayasshpos
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_NAME=backend
    container_name: dynaone-backend
    restart: always
    ports:
      - "3003:3000"
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_NAME=frontend
    container_name: dynaone-frontend
    restart: always
    ports:
      - "3004:3000"
    depends_on:
      - db
    env_file:
      - .env

volumes:
  postgres_data:
